<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="inputTextos">
    <p id="teclaPressionada"></p>

    <script>
        document.getElementById("inputTextos").onkeydown = function(evento) {
            document.getElementById("teclaPressionada")
                .innerText = "Tecla: " + evento.key;
        }
    </script>
</body>
</html>
